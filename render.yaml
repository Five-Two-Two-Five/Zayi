services:
  - type: web
    name: zayi-whatsapp-bot
    env: node
    buildCommand: cd whatsapp-bot && npm install
    startCommand: cd whatsapp-bot && node index.js
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      # NOTE: Add SUPABASE_URL and SUPABASE_KEY in Render Dashboard
